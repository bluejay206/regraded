pluginManagement {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'regraded'

include 'core'
include 'mc1211'
// Paused until Chisels & Bits is available for these versions:
// include 'mc262'
// include 'mc263'
