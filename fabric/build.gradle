plugins {
    id 'net.fabricmc.fabric-loom' version '1.7-SNAPSHOT'
    id 'maven-publish'
}

version = '0.1.0'
group = 'me.bluejay'

base {
    archivesName = 'regraded'
}

dependencies {
    minecraft "com.mojang:minecraft:1.21.1"
    mappings "net.fabricmc:yarn:1.21.1+build.3:v2"
    modImplementation "net.fabricmc:fabric-loader:0.16.9"
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.102.0+1.21.1"

    // Soft dependency on BitsAndChisels (user installs separately)
    // modImplementation "...bitsandchisels..."

    implementation project(':core')
    // Future: implementation project(':survey-io') or published artifact
}

loom {
    splitEnvironmentSourceSets()
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}
